[package]
name = "yibi"
version = "0.3.0"
description = "意笔 - AI 小说写作助手"
authors = ["HraySet"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建必须启用：让 Tauri 加载嵌入的前端资源，而非 devUrl（localhost:5173）
# 缺少该项时 `cargo build --release` 产出的是 dev 模式产物，运行会显示「无法访问此页面」
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
base64 = "0.22"
zip = "2.2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2"
keyring = "4"
encoding_rs = "0.8"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
] }
windows-core = "0.61"
webview2-com = "0.38"

